<!doctype html>
<meta charset="utf-8">
<title>engine facts</title>
<script type="module">
import { engineFacts } from "./engines.mjs";

const worker = new Worker(URL.createObjectURL(new Blob(["onmessage = () => {};"], { type: "text/javascript" })));
window.facts = engineFacts({
  postToWorker: (value) => worker.postMessage(value),
  loadProbe: async (kind) => {
    const glue = await import(`./pkg-${kind}/probe_buffer.js`);
    await glue.default({ module_or_path: `./pkg-${kind}/probe_buffer_bg.wasm` });
    return glue;
  },
}).then((facts) => ({ crossOriginIsolated: window.crossOriginIsolated, ...facts }));
</script>
